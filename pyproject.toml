[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "frontier-model-benchmarking"
version = "0.2.1"
description = "Minimal local text, image and chat client for Kaggle Model Proxy"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "kaggle>=2.2.0,<3",
  "kaggle-benchmarks>=0.6.3,<1",
  "python-dotenv>=1,<2",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
frontier = "frontier_client.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
