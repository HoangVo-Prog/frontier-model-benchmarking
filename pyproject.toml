[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "frontier-model-benchmarking"
version = "0.1.0"
description = "Portable Kaggle frontier model evaluation and chat tools"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["typer>=0.12,<1", "rich>=13", "PyYAML>=6", "python-dotenv>=1"]

[project.optional-dependencies]
kaggle = [
  "kaggle @ git+https://github.com/Kaggle/kaggle-cli.git@f2924fa2781fcf33674f8c31ffbdbabe0578948e",
  "kaggle-benchmarks>=0.6,<1",
  "kagglehub>=1",
]
data = [
  "pyarrow>=11,<12; python_version < '3.12'",
  "pyarrow>=16; python_version >= '3.12'",
]
dev = ["pytest>=8", "kagglehub>=1"]

[project.scripts]
frontier = "frontier_bench.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
